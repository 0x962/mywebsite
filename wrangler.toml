name = "nvdk"
compatibility_date = "2025-06-07"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Authoring: who can write/create posts. Read-only API endpoints
# (GET /api/scenes/...) are public; writes require a verified Cloudflare
# Access JWT (`Cf-Access-Jwt-Assertion`) whose `email` claim is in this list
# and whose `aud` matches CF_ACCESS_AUD.
#
# CF_ACCESS_TEAM_DOMAIN: subdomain only — for "nvdk.cloudflareaccess.com",
#   set "nvdk". Get it from the Zero Trust dashboard.
# CF_ACCESS_AUD: per-application AUD tag from the Access app overview.
#   Set via `wrangler pages secret put CF_ACCESS_AUD --project-name=nvdk`
#   after creating the Access apps, OR set it here once it's not sensitive
#   (AUD tags are not secrets; they're domain-scoped identifiers).
[vars]
ADMIN_EMAILS = "n@nvdk.co"
CF_ACCESS_TEAM_DOMAIN = "navidkhanwip"
# AUDs of the three Access apps fronting protected paths (admin, posts api,
# scenes write). Auto-written by scripts/setup-access.mjs.
CF_ACCESS_AUD = "f878d1f1f6b4e62b705f4db90c4399e32b0a9154e8759290a4526c2f40a8d63e,bd2d7bd37c08e20d7688488a38463cdc15e88b7d7205f1fce0f63d3932be226c,686f31ddcb742a1ea10fa0356b7290649b6157edbb4de66b4635ddde06b7da4f"

# Scene storage. KV value is the Excalidraw scene JSON for slug "<slug>",
# stored under key "scene:<slug>". Post metadata for posts created online
# is stored under "post:<slug>".
[[kv_namespaces]]
binding = "SCENES"
id = "74782c54096c419397d9fde4495b1d70"
preview_id = "9d5815080e214f2aacb03280c491da1a"
